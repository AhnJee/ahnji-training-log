<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>AhnJi: Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0b08;
    --panel:#14160f;
    --panel-2:#1b1e14;
    --line:#2a2e1e;
    --matcha-deep:#3c4a2c;
    --matcha:#8fa968;
    --matcha-bright:#c3d98f;
    --cream:#eef0e4;
    --muted:#8a9280;
    --rest:#6b5b45;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--black);color:var(--cream);}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif;
    min-height:100vh;
    padding-bottom:40px;
  }
  ::selection{background:var(--matcha-deep);color:var(--matcha-bright);}

  /* HEADER */
  header{
    padding:22px 18px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, #101208 0%, var(--black) 100%);
  }
  .title{
    font-size:19px;
    font-weight:700;
    letter-spacing:0.01em;
    display:flex;
    align-items:baseline;
    gap:6px;
  }
  .title .name{color:var(--matcha-bright);}
  .title .rest{color:var(--muted); font-weight:500;}
  .subtitle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:3px;
  }
  .subtitle{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .sync-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    padding:3px 8px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--muted);
    cursor:pointer;
  }
  .sync-badge.sheet{color:var(--matcha-bright);border-color:var(--matcha);}
  .sync-badge.local{color:#d8c6a3;border-color:var(--rest);}
  .sync-badge.memory{color:#c98a8a;border-color:#6b3a3a;}

  /* ODOMETER COUNTER */
  .counter-wrap{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .counter-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    writing-mode:vertical-rl;
    transform:rotate(180deg);
    padding:4px 0;
  }
  .odometer{
    flex:1;
    display:flex;
    align-items:center;
    background:#050603;
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
    gap:10px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
  }
  .odo-btn{
    width:34px;height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--matcha-bright);
    font-size:18px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    user-select:none;
    cursor:pointer;
    flex-shrink:0;
  }
  .odo-btn:active{background:var(--matcha-deep);}  .odo-display{
    flex:1;
    text-align:center;
    position:relative;
  }
  .odo-number{
    font-family:'JetBrains Mono',monospace;
    font-size:30px;
    font-weight:700;
    color:var(--matcha-bright);
    text-shadow:0 0 14px rgba(195,217,143,0.35);
    letter-spacing:0.04em;
  }
  .odo-caption{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.14em;
    margin-top:1px;
  }
  .odo-input{
    display:none;
    width:100%;
    background:transparent;
    border:none;
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:30px;
    font-weight:700;
    color:var(--matcha-bright);
    outline:none;
  }

  .export-row{
    margin-top:10px;
    text-align:right;
  }
  #export-backup{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.04em;
    cursor:pointer;
    padding:4px 2px;
  }
  #export-backup:active{color:var(--matcha-bright);}

  /* DAY TABS */
  .tabs{
    display:flex;
    overflow-x:auto;
    gap:8px;
    padding:14px 18px;
    scrollbar-width:none;
    border-bottom:1px solid var(--line);
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;
    padding:9px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    cursor:pointer;
    white-space:nowrap;
  }
  .tab .d{font-weight:400; opacity:0.75; margin-right:4px;}
  .tab.active{
    background:var(--matcha-deep);
    border-color:var(--matcha);
    color:var(--matcha-bright);
  }
  .tab.rest.active{
    background:#2c2419;
    border-color:var(--rest);
    color:#d8c6a3;
  }

  /* MAIN */
  main{padding:16px 18px 10px;}
  .day-heading{
    font-size:15px;
    font-weight:700;
    color:var(--cream);
    margin-bottom:2px;
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:2px;
  }
  .day-heading .code{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--matcha);
    font-weight:500;
    margin-left:8px;
    outline:none;
  }
  .day-heading .code.editing{
    border-bottom:1px dashed var(--matcha);
    color:var(--matcha-bright);
  }
  .day-code-pencil{
    font-size:10px;
    color:var(--muted);
    cursor:pointer;
    padding:2px 4px;
    flex-shrink:0;
  }
  .day-code-pencil:active{color:var(--matcha-bright);}

  .day-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
  }
  .day-toolbar .day-progress{
    margin-bottom:0;
  }
  .day-progress{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  .rest-toggle-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    letter-spacing:0.04em;
    padding:6px 10px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--muted);
    cursor:pointer;
    flex-shrink:0;
    white-space:nowrap;
  }
  .rest-toggle-btn:active{border-color:var(--matcha);}
  .rest-toggle-btn.active{
    color:#d8c6a3;
    border-color:var(--rest);
    background:#20190f;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:10px;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
  }
  .ex-name{
    font-size:14.5px;
    font-weight:600;
    color:var(--cream);
    display:flex;
    align-items:center;
    gap:7px;
  }
  .ex-name-text{
    outline:none;
  }
  .ex-name-text.editing{
    border-bottom:1px dashed var(--matcha);
    color:var(--matcha-bright);
    padding-bottom:1px;
  }
  .edit-pencil{
    font-size:11px;
    color:var(--muted);
    cursor:pointer;
    flex-shrink:0;
    padding:2px 3px;
  }
  .edit-pencil:active{color:var(--matcha-bright);}
  .ex-prescription{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--matcha);
    margin-top:2px;
  }
  .ex-type-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:5px;
    padding:3px 6px;
    flex-shrink:0;
  }
  .card-actions{
    display:flex;
    align-items:center;
    gap:6px;
    flex-shrink:0;
    margin-left:10px;
  }
  .gear-btn{
    font-size:13px;
    color:var(--muted);
    cursor:pointer;
    padding:2px 4px;
    flex-shrink:0;
  }
  .gear-btn:active{color:var(--matcha-bright);}
  .drag-handle{
    font-size:15px;
    color:var(--muted);
    cursor:grab;
    padding:2px 5px;
    flex-shrink:0;
    touch-action:none;
    user-select:none;
    line-height:1;
  }
  .drag-handle:active{color:var(--matcha-bright);cursor:grabbing;}
  .exercise-list{
    position:relative;
  }
  .card.dragging{
    box-shadow:0 8px 20px rgba(0,0,0,0.5);
    border-color:var(--matcha);
    opacity:0.95;
  }
  .remove-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    cursor:pointer;
    padding:3px 6px;
    border-radius:5px;
    flex-shrink:0;
    border:1px solid transparent;
  }
  .remove-btn:active{color:#c98a8a;}
  .remove-btn.confirm{
    color:#e2a3a3;
    border-color:#6b3a3a;
    background:rgba(107,58,58,0.2);
  }

  .sets-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(72px,1fr));
    gap:8px;
  }
  .set-input-wrap{
    position:relative;
  }
  .set-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:4px;
    display:block;
  }
  .set-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--cream);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    font-weight:600;
    text-align:center;
    padding:9px 4px 9px 4px;
    outline:none;
  }
  .set-input:focus{
    border-color:var(--matcha);
    background:#20241a;
  }
  .set-input.hold{color:var(--matcha-bright);}
  .unit{
    position:absolute;
    right:8px;
    bottom:9px;
    font-size:9px;
    color:var(--muted);
    pointer-events:none;
  }
  .dual-input{
    display:flex;
    align-items:center;
    gap:3px;
  }
  .dual-input .set-input{
    padding:8px 2px;
    font-size:13.5px;
    min-width:0;
  }
  .dual-sep{
    color:var(--muted);
    font-size:10px;
    flex-shrink:0;
  }
  .dual-units{
    display:flex;
    justify-content:space-between;
    margin-top:3px;
    padding:0 2px;
  }
  .dual-units span{
    font-family:'JetBrains Mono',monospace;
    font-size:8px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.04em;
  }

  /* cardio card */
  .cardio-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    gap:10px;
  }
  .cardio-info{min-width:0;}
  .cardio-info .ex-name{margin-bottom:1px;}
  .check{
    width:26px;height:26px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size:15px;
    color:transparent;
  }
  .check.done{
    background:var(--matcha-deep);
    border-color:var(--matcha);
    color:var(--matcha-bright);
  }

  /* rest timer */
  .rest-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .rest-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:0.1em;
    flex-shrink:0;
  }
  .rest-timer{
    position:relative;
    flex:1;
    height:34px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel-2);
    overflow:hidden;
    cursor:pointer;
    user-select:none;
  }
  .rest-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width:100%;
    background:var(--matcha-deep);
    transition:width 1s linear;
  }
  .rest-text{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:0.03em;
  }
  .rest-timer.running .rest-text{color:var(--matcha-bright);}
  .rest-timer.running{border-color:var(--matcha);}
  .rest-timer.done{
    border-color:var(--matcha-bright);
  }
  .rest-timer.done .rest-fill{
    background:var(--matcha);
  }
  .rest-timer.done .rest-text{
    color:#0a0b08;
    font-weight:700;
  }

  /* inline exercise editor */
  .edit-panel{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .edit-row{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .edit-row label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--muted);
  }
  .edit-row select,
  .edit-row input[type="text"],
  .edit-row input[type="number"]{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--cream);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    padding:9px 10px;
    outline:none;
    width:100%;
  }
  .edit-row select:focus,
  .edit-row input:focus{
    border-color:var(--matcha);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper-btn{
    width:30px;height:30px;
    border-radius:7px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--matcha-bright);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:15px;
    user-select:none;
    flex-shrink:0;
  }
  .stepper-btn:active{background:var(--matcha-deep);}
  .stepper-val{
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:700;
    color:var(--cream);
    min-width:18px;
    text-align:center;
  }
  .edit-actions{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .edit-save,.edit-cancel{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.05em;
    cursor:pointer;
  }
  .edit-save{
    background:var(--matcha-deep);
    border:1px solid var(--matcha);
    color:var(--matcha-bright);
  }
  .edit-save:active{background:var(--matcha);color:#0a0b08;}
  .edit-cancel{
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--muted);
  }

  .add-exercise-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:13px;
    border-radius:12px;
    border:1px dashed var(--line);
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    letter-spacing:0.04em;
    cursor:pointer;
    margin-top:4px;
  }
  .add-exercise-btn:active{border-color:var(--matcha);color:var(--matcha-bright);}

  /* rest day */
  .rest-panel{
    text-align:center;
    padding:44px 20px;
    color:var(--muted);
  }
  .rest-panel .big{
    font-size:15px;
    color:#d8c6a3;
    font-weight:600;
    margin-bottom:6px;
  }
  .rest-panel .small{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
  }

  .loading-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  .save-toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--matcha-deep);
    color:var(--matcha-bright);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    padding:8px 16px;
    border-radius:20px;
    border:1px solid var(--matcha);
    opacity:0;
    transition:opacity 0.25s ease, transform 0.25s ease;
    pointer-events:none;
    letter-spacing:0.04em;
  }
  .save-toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* PASSWORD GATE */
  #gate-screen{
    position:fixed;
    inset:0;
    z-index:1000;
    background:var(--black);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .gate-box{
    width:100%;
    max-width:320px;
    text-align:center;
  }
  .gate-title{
    font-size:19px;
    font-weight:700;
    color:var(--matcha-bright);
    margin-bottom:4px;
  }
  .gate-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.03em;
    margin-bottom:24px;
  }
  .gate-input{
    width:100%;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--cream);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    padding:13px 14px;
    outline:none;
    text-align:center;
    letter-spacing:0.04em;
  }
  .gate-input:focus{border-color:var(--matcha);}
  .gate-btn{
    margin-top:12px;
    width:100%;
    padding:13px;
    border-radius:10px;
    background:var(--matcha-deep);
    border:1px solid var(--matcha);
    color:var(--matcha-bright);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.06em;
    cursor:pointer;
  }
  .gate-btn:active{background:var(--matcha);color:#0a0b08;}
  .gate-error{
    margin-top:12px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:#e2a3a3;
    min-height:14px;
  }
  #app-content{display:none;}
</style>
</head>
<body>

<div id="gate-screen">
  <div class="gate-box">
    <div class="gate-title">AhnJi</div>
    <div class="gate-sub">enter password to continue</div>
    <input type="password" id="gate-input" class="gate-input" placeholder="password" autocomplete="off">
    <div class="gate-btn" id="gate-submit">Unlock</div>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="app-content">

<header>
  <div class="title"><span class="name">AhnJi</span><span class="rest">Training Log</span></div>
  <div class="subtitle-row">
    <div class="subtitle" id="today-label">—</div>
    <div class="sync-badge" id="sync-badge">···</div>
  </div>

  <div class="counter-wrap">
    <div class="counter-label">SESSIONS</div>
    <div class="odometer">
      <div class="odo-btn" id="odo-minus">−</div>
      <div class="odo-display" id="odo-display">
        <div class="odo-number" id="odo-number">000</div>
        <div class="odo-caption">days worked out · tap to edit</div>
        <input class="odo-input" id="odo-input" inputmode="numeric" type="number" min="0">
      </div>
      <div class="odo-btn" id="odo-plus">+</div>
    </div>
  </div>

  <div class="export-row">
    <span id="export-backup">⬇ Export backup</span>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main id="main"></main>

<div class="save-toast" id="toast">saved</div>

</div>

<script>
// ---- PASSWORD GATE ----
// Client-side only: this hides the app UI until the right password is
// entered. It does NOT protect the Apps Script backend itself — anyone
// who has (or extracts) the API_URL from this page's source can still
// call it directly. This gate just stops casual visitors from opening
// and editing the routine through the app. Unlocking is remembered for
// this browser tab's session (closing the tab locks it again).
const GATE_PASSWORD = 'MosinGianWorkoutRoutine911';
const GATE_SESSION_KEY = '__ahnji_unlocked__';

function showApp(){
  document.getElementById('gate-screen').style.display = 'none';
  document.getElementById('app-content').style.display = 'block';
}

function tryUnlock(){
  const input = document.getElementById('gate-input');
  const err = document.getElementById('gate-error');
  if(input.value === GATE_PASSWORD){
    try{ sessionStorage.setItem(GATE_SESSION_KEY, '1'); }catch(e){}
    showApp();
    init();
  } else {
    err.textContent = 'wrong password';
    input.value = '';
    input.focus();
  }
}

document.getElementById('gate-submit').addEventListener('click', tryUnlock);
document.getElementById('gate-input').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') tryUnlock();
});

let alreadyUnlocked = false;
try{ alreadyUnlocked = sessionStorage.getItem(GATE_SESSION_KEY) === '1'; }catch(e){}
if(alreadyUnlocked){
  showApp();
} else {
  document.getElementById('gate-input').focus();
}

function cloneDefaultDayConfig(){
  const cfg = {};
  DEFAULT_DAYS.forEach(d=>{
    cfg[d.id] = {
      rest: d.rest,
      code: d.code,
      exercises: d.exercises.map(ex=>({ ...ex }))
    };
  });
  return cfg;
}

// Fetch with a hard timeout — prevents the app from hanging forever if the
// Apps Script backend is slow, cold-starting, or unreachable.
function fetchWithTimeout(url, options = {}, timeoutMs = 6000){
  const controller = new AbortController();
  const id = setTimeout(()=> controller.abort(), timeoutMs);
  return fetch(url, { ...options, signal: controller.signal }).finally(()=> clearTimeout(id));
}

// Storage adapter: writes to the Google Sheet backend when CONFIG.API_URL is
// set, mirrors every write to localStorage as an offline cache, and reads
// from localStorage if the Sheet is unreachable (no signal, script down, etc).
//
// Offline sync queue: when a write to the Sheet fails, it's queued here
// (keyed by storage key, latest value wins) and retried automatically once
// the connection is back — so offline entries don't get lost, just delayed.
// This queue is purely internal plumbing now: it still guarantees no data
// loss, but the UI no longer surfaces a distinct "pending" state to the
// user — see updateSyncBadge().
const QUEUE_KEY = '__pending_sync_queue__';

function getQueue(){
  try{
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveQueue(q){
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){}
}
function addToQueue(key, value){
  const q = getQueue();
  q[key] = value;
  saveQueue(q);
}
function removeFromQueue(key){
  const q = getQueue();
  if(key in q){ delete q[key]; saveQueue(q); }
}
function queueSize(){
  return Object.keys(getQueue()).length;
}

async function flushPendingQueue(){
  if(!CONFIG.API_URL) return;
  const q = getQueue();
  const keys = Object.keys(q);
  if(keys.length === 0) return;

  let syncedAny = false;
  for(const key of keys){
    try{
      await fetchWithTimeout(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, value: q[key] })
      });
      removeFromQueue(key);
      syncedAny = true;
    }catch(e){
      break; // still unreachable — stop and try again next time
    }
  }

  if(syncedAny){
    storageMode = queueSize() === 0 ? 'sheet' : 'local';
    updateSyncBadge();
    if(queueSize() === 0) showToast('synced');
  }
}

const store = {
  async get(key){
    // A queued (unsynced) local write means this key has a change the
    // backend has never successfully received. Trusting a remote read here
    // would silently discard that pending edit — so a queued write always
    // wins, it's just labeled as "local" in the UI rather than a separate
    // pending state.
    const pending = getQueue();
    if(key in pending){
      storageMode = 'local';
      try{ localStorage.setItem(key, pending[key]); }catch(e){}
      return pending[key];
    }
    if(CONFIG.API_URL){
      try{
        const res = await fetchWithTimeout(`${CONFIG.API_URL}?key=${encodeURIComponent(key)}`);
        if(!res.ok) throw new Error('bad status ' + res.status);
        const data = await res.json();
        if(typeof data !== 'object' || data === null) throw new Error('malformed response');
        storageMode = 'sheet';
        if(data.value !== undefined && data.value !== null){
          try{ localStorage.setItem(key, data.value); }catch(e){}
          return data.value;
        }
        // Backend explicitly has no value for this key — only trust that
        // if there's no local copy either; otherwise a fresh/empty backend
        // (e.g. redeployed under a new URL) would wipe existing local data.
        try{
          const localVal = localStorage.getItem(key);
          if(localVal !== null){ storageMode = 'local'; return localVal; }
        }catch(e){}
        return null;
      }catch(e){
        console.warn('Sheet read failed for', key, '— using local cache.', e);
        // fall through to local cache (timeout, offline, 404, or malformed response)
      }
    }
    try{
      const v = localStorage.getItem(key);
      if(storageMode !== 'sheet') storageMode = 'local';
      return v;
    }catch(e){
      storageMode = 'memory';
      return null;
    }
  },
  async set(key, value){
    let sheetOk = false;
    if(CONFIG.API_URL){
      try{
        await fetchWithTimeout(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ key, value })
        });
        sheetOk = true;
        storageMode = 'sheet';
        removeFromQueue(key);
      }catch(e){
        addToQueue(key, value);
      }
    }
    try{
      localStorage.setItem(key, value);
      if(!sheetOk){
        storageMode = CONFIG.API_URL ? 'local' : 'local';
      }
      return true;
    }catch(e){
      if(!sheetOk){ storageMode = 'memory'; return false; }
      return true;
    }
  }
};
let timerState = {}; // exId -> { remaining, total, intervalId, running }

function formatTime(sec){
  const m = Math.floor(sec/60);
  const s = sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function clearAllTimers(){
  Object.values(timerState).forEach(st=>{
    if(st && st.intervalId) clearInterval(st.intervalId);
  });
  timerState = {};
}

function updateTimerUI(exId, remaining, total){
  const fill = document.querySelector(`.rest-fill[data-ex="${exId}"]`);
  const text = document.querySelector(`.rest-text[data-ex="${exId}"]`);
  if(text) text.textContent = formatTime(remaining);
  if(fill) fill.style.width = `${Math.max(0,(remaining/total)*100)}%`;
}

function toggleTimer(exId, total){
  const el = document.querySelector(`.rest-timer[data-ex="${exId}"]`);
  if(!el) return;
  let st = timerState[exId];

  if(st && st.running){
    clearInterval(st.intervalId);
    timerState[exId] = null;
    el.classList.remove('running','done');
    updateTimerUI(exId, total, total);
    return;
  }

  st = { remaining: total, total, running: true };
  timerState[exId] = st;
  el.classList.add('running');
  el.classList.remove('done');
  updateTimerUI(exId, st.remaining, total);

  st.intervalId = setInterval(()=>{
    st.remaining -= 1;
    if(st.remaining <= 0){
      clearInterval(st.intervalId);
      st.running = false;
      el.classList.remove('running');
      el.classList.add('done');
      updateTimerUI(exId, 0, total);
      onTimerComplete();
      setTimeout(()=>{
        el.classList.remove('done');
        updateTimerUI(exId, total, total);
        timerState[exId] = null;
      }, 1500);
      return;
    }
    updateTimerUI(exId, st.remaining, total);
  }, 1000);
}

function onTimerComplete(){
  if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.16;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    setTimeout(()=>{ o.stop(); ctx.close(); }, 400);
  }catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg || 'saved';
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1100);
}

async function loadAll(){
  dayConfig = cloneDefaultDayConfig();

  const [rawSessions, rawNames, rawDayConfig, ...rawDays] = await Promise.all([
    store.get('sessions-count'),
    store.get('exercise-names'),
    store.get('day-config'),
    ...DEFAULT_DAYS.map(day => store.get('day-data:' + day.id))
  ]);

  sessions = rawSessions ? (parseInt(rawSessions,10) || 0) : 0;
  renderOdometer();

  // Legacy rename migration: older versions stored renames separately.
  // Apply them to the defaults before any saved day-config (below) takes over.
  try{
    const legacyNames = rawNames ? JSON.parse(rawNames) : {};
    Object.values(dayConfig).forEach(dc=>{
      dc.exercises.forEach(ex=>{
        if(legacyNames[ex.id]) ex.name = legacyNames[ex.id];
      });
    });
  }catch(e){}

  // Saved custom day config (exercise list, rest flag, code, per-exercise
  // sets/prescription/rest/type/unit) fully overrides the defaults per day.
  try{
    const savedConfig = rawDayConfig ? JSON.parse(rawDayConfig) : null;
    if(savedConfig){
      Object.keys(savedConfig).forEach(dayId=>{
        if(dayConfig[dayId]) dayConfig[dayId] = savedConfig[dayId];
      });
    }
  }catch(e){}

  // Backfill unit for any weight exercise that predates the kg/lb option
  Object.values(dayConfig).forEach(dc=>{
    dc.exercises.forEach(ex=>{
      if(ex.type === 'weight' && !ex.unit) ex.unit = 'lb';
    });
  });

  DEFAULT_DAYS.forEach((day, i)=>{
    try{
      dayData[day.id] = rawDays[i] ? JSON.parse(rawDays[i]) : {};
    }catch(e){
      dayData[day.id] = {};
    }
  });
}

function renderOdometer(){
  document.getElementById('odo-number').textContent = String(sessions).padStart(3,'0');
}

async function saveSessions(){
  const ok = await store.set('sessions-count', String(sessions));
  showToast(ok ? 'saved' : 'save failed');
  updateSyncBadge();
}

async function saveDay(dayId){
  const ok = await store.set('day-data:' + dayId, JSON.stringify(dayData[dayId] || {}));
  showToast(ok ? 'saved' : 'save failed');
  updateSyncBadge();
}

async function saveDayConfig(){
  const ok = await store.set('day-config', JSON.stringify(dayConfig));
  showToast(ok ? 'saved' : 'save failed');
  updateSyncBadge();
}

function todayLabel(){
  const d = new Date();
  const opts = { weekday:'long', month:'short', day:'numeric' };
  return d.toLocaleDateString('en-US', opts).toUpperCase();
}

function buildTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  DEFAULT_DAYS.forEach(day=>{
    const dc = dayConfig[day.id] || day;
    const tab = document.createElement('div');
    tab.className = 'tab' + (dc.rest ? ' rest' : '');
    tab.innerHTML = `<span class="d">${day.label.slice(0,3)}</span>${dc.code}`;
    tab.dataset.day = day.id;
    tab.addEventListener('click', ()=> setActiveDay(day.id));
    tabsEl.appendChild(tab);
  });
  if(activeDay){
    document.querySelectorAll('.tab').forEach(t=>{
      t.classList.toggle('active', t.dataset.day === activeDay);
    });
  }
}
function refreshTabs(){ buildTabs(); }

function setActiveDay(dayId){
  activeDay = dayId;
  addFormOpenFor = null;
  editFormOpenFor = null;
  clearAllTimers();
  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.day === dayId);
  });
  renderDay(dayId);
}

function generateExerciseId(name){
  const base = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'') || 'exercise';
  return base + '-' + Date.now().toString(36).slice(-5);
}

function toggleDayRest(dayId){
  dayConfig[dayId].rest = !dayConfig[dayId].rest;
  addFormOpenFor = null;
  editFormOpenFor = null;
  saveDayConfig();
  refreshTabs();
  renderDay(dayId);
}

function removeExercise(dayId, exId){
  dayConfig[dayId].exercises = dayConfig[dayId].exercises.filter(e=> e.id !== exId);
  if(dayData[dayId]) delete dayData[dayId][exId];
  if(editFormOpenFor === exId) editFormOpenFor = null;
  saveDayConfig();
  saveDay(dayId);
  renderDay(dayId);
}

function openAddForm(dayId){
  editFormOpenFor = null;
  addFormOpenFor = dayId;
  renderDay(dayId);
}

function wireExerciseForm(panelEl, dayId, exId){
  let setsVal = parseInt(panelEl.querySelector('.ex-form-sets-val').textContent, 10) || 3;
  const typeSelect = panelEl.querySelector('.ex-form-type');
  const setsRow = panelEl.querySelector('.ex-form-sets-row');
  const restRow = panelEl.querySelector('.ex-form-rest-row');
  const unitRow = panelEl.querySelector('.ex-form-unit-row');

  typeSelect.addEventListener('change', ()=>{
    const isCardio = typeSelect.value === 'cardio';
    const isWeight = typeSelect.value === 'weight';
    setsRow.style.display = isCardio ? 'none' : '';
    restRow.style.display = isCardio ? 'none' : '';
    unitRow.style.display = isWeight ? '' : 'none';
  });

  panelEl.querySelector('.ex-form-sets-minus').addEventListener('click', ()=>{
    setsVal = Math.max(1, setsVal - 1);
    panelEl.querySelector('.ex-form-sets-val').textContent = setsVal;
  });
  panelEl.querySelector('.ex-form-sets-plus').addEventListener('click', ()=>{
    setsVal = Math.min(6, setsVal + 1);
    panelEl.querySelector('.ex-form-sets-val').textContent = setsVal;
  });

  panelEl.querySelector('.edit-cancel').addEventListener('click', ()=>{
    if(exId){ editFormOpenFor = null; } else { addFormOpenFor = null; }
    renderDay(dayId);
  });

  panelEl.querySelector('.edit-save').addEventListener('click', ()=>{
    const name = panelEl.querySelector('.ex-form-name').value.trim();
    const type = typeSelect.value;
    const prescription = panelEl.querySelector('.ex-form-prescription').value.trim();
    const restSec = parseInt(panelEl.querySelector('.ex-form-rest').value, 10) || 0;
    const sets = setsVal;
    const unit = panelEl.querySelector('.ex-form-unit').value;

    if(!name){
      panelEl.querySelector('.ex-form-name').focus();
      return;
    }

    if(exId){
      const ex = dayConfig[dayId].exercises.find(x=> x.id === exId);
      if(!ex) return;
      const typeChanged = ex.type !== type;
      const setsChanged = type !== 'cardio' && ex.sets !== sets;
      const unitChanged = type === 'weight' && ex.unit !== unit;
      ex.name = name;
      ex.type = type;
      ex.prescription = prescription;
      if(type !== 'cardio'){
        ex.sets = sets;
        ex.restSec = restSec;
      } else {
        delete ex.sets;
        delete ex.restSec;
      }
      if(type === 'weight'){
        ex.unit = unit;
      } else {
        delete ex.unit;
      }
      if(typeChanged || setsChanged){
        if(!dayData[dayId]) dayData[dayId] = {};
        dayData[dayId][exId] = (type === 'cardio') ? false : Array(sets).fill(null);
      } else if(unitChanged){
        // Values stay as raw numbers — just relabeled; no conversion is
        // attempted since past entries were logged in the old unit.
      }
      editFormOpenFor = null;
    } else {
      const id = generateExerciseId(name);
      const newEx = {
        id, name, type,
        prescription: prescription
      };
      if(type !== 'cardio'){
        newEx.sets = sets;
        newEx.restSec = restSec;
      }
      if(type === 'weight'){
        newEx.unit = unit;
      }
      dayConfig[dayId].exercises.push(newEx);
      if(dayConfig[dayId].rest) dayConfig[dayId].rest = false;
      if(!dayData[dayId]) dayData[dayId] = {};
      dayData[dayId][id] = (type === 'cardio') ? false : Array(sets).fill(null);
      addFormOpenFor = null;
    }

    saveDayConfig();
    saveDay(dayId);
    refreshTabs();
    renderDay(dayId);
  });
}

function renderExerciseCard(dayId, ex){
  const card = document.createElement('div');

  if(ex.type === 'cardio'){
    card.className = 'card cardio-card';
    card.dataset.exId = ex.id;
    const done = !!(dayData[dayId] && dayData[dayId][ex.id]);
    card.innerHTML = `
      <div class="cardio-info">
        <div class="ex-name" data-ex="${ex.id}">
          <span class="ex-name-text">${ex.name}</span>
          <span class="edit-pencil" data-ex="${ex.id}">✎</span>
        </div>
        ${ex.prescription ? `<div class="ex-prescription">${ex.prescription}</div>` : ''}
      </div>
      <div class="card-actions">
        <div class="drag-handle" data-ex="${ex.id}">⠿</div>
        <div class="gear-btn" data-ex="${ex.id}">⚙</div>
        <div class="remove-btn" data-ex="${ex.id}">✕</div>
        <div class="check ${done ? 'done' : ''}" data-ex="${ex.id}">✓</div>
      </div>
    `;
    card.querySelector('.check').addEventListener('click', (e)=>{
      if(!dayData[dayId]) dayData[dayId] = {};
      const cur = !!dayData[dayId][ex.id];
      dayData[dayId][ex.id] = !cur;
      e.target.classList.toggle('done', !cur);
      saveDay(dayId);
    });
  } else {
    card.className = 'card';
    card.dataset.exId = ex.id;
    const sets = ex.sets || 3;
    const values = (dayData[dayId] && dayData[dayId][ex.id]) || [];
    const isHold = ex.type === 'hold';
    const isWeight = ex.type === 'weight';
    const weightUnit = ex.unit || 'lb';
    const tag = isHold ? 'HOLD' : (isWeight ? 'LOAD' : 'REPS');

    let setsHtml = '';
    if(isWeight){
      setsHtml = Array.from({length: sets}).map((_, i)=>{
        const v = (values[i] && typeof values[i] === 'object') ? values[i] : {};
        return `
          <div class="set-input-wrap">
            <span class="set-label">Set ${i+1}</span>
            <div class="dual-input">
              <input class="set-input" type="number" inputmode="decimal"
                data-ex="${ex.id}" data-set="${i}" data-field="w" value="${v.w ?? ''}" placeholder="0">
              <span class="dual-sep">×</span>
              <input class="set-input" type="number" inputmode="numeric"
                data-ex="${ex.id}" data-set="${i}" data-field="r" value="${v.r ?? ''}" placeholder="0">
            </div>
            <div class="dual-units"><span>${weightUnit}</span><span>reps</span></div>
          </div>`;
      }).join('');
    } else {
      const unit = isHold ? 's' : 'reps';
      setsHtml = Array.from({length: sets}).map((_, i)=>{
        const v = (values[i] !== undefined && values[i] !== null && typeof values[i] !== 'object') ? values[i] : '';
        return `
          <div class="set-input-wrap">
            <span class="set-label">Set ${i+1}</span>
            <input class="set-input ${isHold?'hold':''}" type="number" inputmode="${isHold?'decimal':'numeric'}"
              data-ex="${ex.id}" data-set="${i}" data-field="v" value="${v}" placeholder="0">
            <span class="unit">${unit}</span>
          </div>`;
      }).join('');
    }

    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="ex-name" data-ex="${ex.id}">
            <span class="ex-name-text">${ex.name}</span>
            <span class="edit-pencil" data-ex="${ex.id}">✎</span>
          </div>
          ${ex.prescription ? `<div class="ex-prescription">${ex.prescription}</div>` : ''}
        </div>
        <div class="card-actions">
          <div class="ex-type-tag">${tag}${isWeight ? ' · ' + weightUnit.toUpperCase() : ''}</div>
          <div class="drag-handle" data-ex="${ex.id}">⠿</div>
          <div class="gear-btn" data-ex="${ex.id}">⚙</div>
          <div class="remove-btn" data-ex="${ex.id}">✕</div>
        </div>
      </div>
      <div class="sets-row">
        ${setsHtml}
      </div>
      <div class="rest-row">
        <span class="rest-label">Rest</span>
        <div class="rest-timer" data-ex="${ex.id}" data-seconds="${ex.restSec || 120}">
          <div class="rest-fill" data-ex="${ex.id}"></div>
          <span class="rest-text" data-ex="${ex.id}">${formatTime(ex.restSec || 120)}</span>
        </div>
      </div>
    `;

    card.querySelectorAll('.set-input').forEach(input=>{
      input.addEventListener('change', (e)=>{
        const exId = e.target.dataset.ex;
        const setIdx = parseInt(e.target.dataset.set, 10);
        const field = e.target.dataset.field;
        if(!dayData[dayId]) dayData[dayId] = {};
        if(!dayData[dayId][exId] || !Array.isArray(dayData[dayId][exId])){
          dayData[dayId][exId] = Array(sets).fill(null);
        }
        if(field === 'v'){
          dayData[dayId][exId][setIdx] = e.target.value;
        } else {
          const cur = (dayData[dayId][exId][setIdx] && typeof dayData[dayId][exId][setIdx] === 'object')
            ? dayData[dayId][exId][setIdx] : {};
          cur[field] = e.target.value;
          dayData[dayId][exId][setIdx] = cur;
        }
        saveDay(dayId);
      });
    });

    card.querySelector('.rest-timer').addEventListener('click', ()=>{
      toggleTimer(ex.id, ex.restSec || 120);
    });
  }

  // rename via pencil (applies to ex.name directly, saved with dayConfig)
  card.querySelector('.edit-pencil').addEventListener('click', (e)=>{
    const nameEl = e.target.previousElementSibling;
    startEditingName(nameEl, dayId, ex.id);
  });

  // gear -> open/close full edit panel
  card.querySelector('.gear-btn').addEventListener('click', ()=>{
    editFormOpenFor = (editFormOpenFor === ex.id) ? null : ex.id;
    renderDay(dayId);
  });

  // remove, with a two-tap confirm (no browser confirm() — blocked in sandboxed views)
  const removeBtn = card.querySelector('.remove-btn');
  removeBtn.addEventListener('click', ()=>{
    if(removeBtn.classList.contains('confirm')){
      removeExercise(dayId, ex.id);
    } else {
      removeBtn.classList.add('confirm');
      removeBtn.textContent = 'sure?';
      setTimeout(()=>{
        removeBtn.classList.remove('confirm');
        removeBtn.textContent = '✕';
      }, 2500);
    }
  });

  if(editFormOpenFor === ex.id){
    const wrap = document.createElement('div');
    wrap.innerHTML = exerciseFormHTML(ex);
    const panelEl = wrap.firstElementChild;
    card.appendChild(panelEl);
    wireExerciseForm(panelEl, dayId, ex.id);
  }

  makeDraggable(card, dayId);

  return card;
}

function makeDraggable(card, dayId){
  const handle = card.querySelector('.drag-handle');
  if(!handle) return;

  handle.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    const listEl = card.parentElement;
    let startY = e.clientY;

    card.setPointerCapture(e.pointerId);
    card.classList.add('dragging');
    card.style.position = 'relative';
    card.style.zIndex = 50;
    document.body.style.overscrollBehavior = 'none';
    document.body.style.touchAction = 'none';

    function onMove(ev){
      const dy = ev.clientY - startY;
      card.style.transform = `translateY(${dy}px)`;

      const cardRect = card.getBoundingClientRect();
      const cardMidY = cardRect.top + cardRect.height / 2;
      const siblings = Array.from(listEl.children).filter(c => c !== card && c.classList.contains('card'));

      for(const sib of siblings){
        const sibRect = sib.getBoundingClientRect();
        const sibMidY = sibRect.top + sibRect.height / 2;
        if(dy < 0 && cardMidY < sibMidY){
          listEl.insertBefore(card, sib);
          startY = ev.clientY;
          card.style.transform = 'translateY(0px)';
          break;
        } else if(dy > 0 && cardMidY > sibMidY){
          listEl.insertBefore(card, sib.nextSibling);
          startY = ev.clientY;
          card.style.transform = 'translateY(0px)';
          break;
        }
      }
    }

    function onUp(ev){
      card.releasePointerCapture(ev.pointerId);
      card.classList.remove('dragging');
      card.style.transform = '';
      card.style.zIndex = '';
      card.style.position = '';
      document.body.style.overscrollBehavior = '';
      document.body.style.touchAction = '';
      card.removeEventListener('pointermove', onMove);
      card.removeEventListener('pointerup', onUp);
      card.removeEventListener('pointercancel', onUp);

      const newOrder = Array.from(listEl.children)
        .filter(c => c.classList.contains('card') && c.dataset.exId)
        .map(c => c.dataset.exId);
      dayConfig[dayId].exercises.sort((a, b) => newOrder.indexOf(a.id) - newOrder.indexOf(b.id));
      saveDayConfig();
    }

    card.addEventListener('pointermove', onMove);
    card.addEventListener('pointerup', onUp);
    card.addEventListener('pointercancel', onUp);
  });
}

function renderDay(dayId){
  const dc = dayConfig[dayId];
  const dayMeta = DEFAULT_DAYS.find(d=> d.id === dayId);
  const main = document.getElementById('main');
  main.innerHTML = '';

  const heading = document.createElement('div');
  heading.innerHTML = `
    <div class="day-heading">
      ${dayMeta.label}
      <span class="code" tabindex="0">${dc.code}</span>
      <span class="edit-pencil day-code-pencil">✎</span>
    </div>`;
  main.appendChild(heading);
  heading.querySelector('.day-code-pencil').addEventListener('click', ()=>{
    startEditingDayCode(heading.querySelector('.code'), dayId);
  });

  const toolbar = document.createElement('div');
  toolbar.className = 'day-toolbar';
  toolbar.innerHTML = `
    <div class="day-progress" id="day-progress-text"></div>
    <div class="rest-toggle-btn ${dc.rest ? 'active' : ''}" id="rest-toggle-btn">${dc.rest ? '☾ Rest day' : '⇄ Make rest day'}</div>
  `;
  main.appendChild(toolbar);
  toolbar.querySelector('#rest-toggle-btn').addEventListener('click', ()=> toggleDayRest(dayId));
  const progressEl = toolbar.querySelector('#day-progress-text');

  if(dc.rest){
    const restPanel = document.createElement('div');
    restPanel.className = 'rest-panel';
    restPanel.innerHTML = `
      <div class="big">Decompression Day</div>
      <div class="small">${dc.exercises.length ? dc.exercises.length + ' saved exercise(s) hidden — switch to workout to see them' : 'no lifts logged here'}</div>`;
    main.appendChild(restPanel);
  } else {
    const listEl = document.createElement('div');
    listEl.className = 'exercise-list';
    dc.exercises.forEach(ex=>{
      listEl.appendChild(renderExerciseCard(dayId, ex));
    });
    main.appendChild(listEl);
  }

  if(addFormOpenFor === dayId){
    const formCard = document.createElement('div');
    formCard.className = 'card';
    formCard.innerHTML = exerciseFormHTML(null);
    main.appendChild(formCard);
    wireExerciseForm(formCard, dayId, null);
  } else {
    const addBtn = document.createElement('div');
    addBtn.className = 'add-exercise-btn';
    addBtn.textContent = '+ Add exercise';
    addBtn.addEventListener('click', ()=> openAddForm(dayId));
    main.appendChild(addBtn);
  }

  // progress readout
  let totalFields = 0;
  let filled = 0;
  dc.exercises.forEach(ex=>{
    if(ex.type === 'cardio'){
      totalFields += 1;
      if(dayData[dayId] && dayData[dayId][ex.id]) filled += 1;
    } else if(ex.type === 'weight'){
      const n = ex.sets || 3;
      totalFields += n * 2;
      const v = dayData[dayId] && dayData[dayId][ex.id];
      if(Array.isArray(v)){
        v.forEach(entry=>{
          if(entry && typeof entry === 'object'){
            if(entry.w !== '' && entry.w != null) filled++;
            if(entry.r !== '' && entry.r != null) filled++;
          }
        });
      }
    } else {
      const n = ex.sets || 3;
      totalFields += n;
      const v = dayData[dayId] && dayData[dayId][ex.id];
      if(Array.isArray(v)) filled += v.filter(x=> x !== '' && x != null && typeof x !== 'object').length;
    }
  });
  progressEl.textContent = dc.rest ? '' : `${filled} / ${totalFields} FIELDS LOGGED`;
}

function startEditingName(nameEl, dayId, exId){
  if(nameEl.classList.contains('editing')) return;
  const original = nameEl.textContent;
  nameEl.classList.add('editing');
  nameEl.contentEditable = 'true';
  nameEl.focus();
  placeCaretAtEnd(nameEl);

  function finish(){
    nameEl.classList.remove('editing');
    nameEl.contentEditable = 'false';
    const newName = nameEl.textContent.trim();
    const ex = dayConfig[dayId].exercises.find(e=> e.id === exId);
    if(newName && ex && newName !== ex.name){
      ex.name = newName;
      saveDayConfig();
    } else if(!newName){
      nameEl.textContent = original;
    }
    nameEl.removeEventListener('blur', finish);
    nameEl.removeEventListener('keydown', onKey);
  }
  function onKey(e){
    if(e.key === 'Enter'){ e.preventDefault(); nameEl.blur(); }
  }
  nameEl.addEventListener('blur', finish);
  nameEl.addEventListener('keydown', onKey);
}

function startEditingDayCode(codeEl, dayId){
  if(codeEl.classList.contains('editing')) return;
  const original = codeEl.textContent;
  codeEl.classList.add('editing');
  codeEl.contentEditable = 'true';
  codeEl.focus();
  placeCaretAtEnd(codeEl);

  function finish(){
    codeEl.classList.remove('editing');
    codeEl.contentEditable = 'false';
    const val = codeEl.textContent.trim().toUpperCase();
    if(val && val !== dayConfig[dayId].code){
      dayConfig[dayId].code = val;
      saveDayConfig();
      refreshTabs();
    } else if(!val){
      codeEl.textContent = original;
    }
    codeEl.removeEventListener('blur', finish);
    codeEl.removeEventListener('keydown', onKey);
  }
  function onKey(e){
    if(e.key === 'Enter'){ e.preventDefault(); codeEl.blur(); }
  }
  codeEl.addEventListener('blur', finish);
  codeEl.addEventListener('keydown', onKey);
}

function placeCaretAtEnd(el){
  const range = document.createRange();
  const sel = window.getSelection();
  range.selectNodeContents(el);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
}

function currentDayId(){
  const idx = new Date().getDay(); // 0=Sun
  return DEFAULT_DAYS[idx].id;
}

document.getElementById('odo-minus').onclick = ()=>{
  sessions = Math.max(0, sessions - 1);
  renderOdometer();
  saveSessions();
};
document.getElementById('odo-plus').onclick = ()=>{
  sessions += 1;
  renderOdometer();
  saveSessions();
};

const odoDisplay = document.getElementById('odo-display');
const odoNumber = document.getElementById('odo-number');
const odoInput = document.getElementById('odo-input');
odoDisplay.addEventListener('click', ()=>{
  odoNumber.style.display = 'none';
  document.querySelector('.odo-caption').style.display = 'none';
  odoInput.style.display = 'block';
  odoInput.value = sessions;
  odoInput.focus();
  odoInput.select();
});
function commitOdoInput(){
  const val = parseInt(odoInput.value, 10);
  sessions = isNaN(val) ? sessions : Math.max(0, val);
  odoInput.style.display = 'none';
  odoNumber.style.display = 'block';
  document.querySelector('.odo-caption').style.display = 'block';
  renderOdometer();
  saveSessions();
}
odoInput.addEventListener('blur', commitOdoInput);
odoInput.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter'){ odoInput.blur(); }
});

async function init(){
  document.getElementById('today-label').textContent = todayLabel();
  document.getElementById('main').innerHTML = `<div class="loading-state">Loading your data…</div>`;
  await loadAll();
  buildTabs();
  setActiveDay(currentDayId());
  updateSyncBadge();
  flushPendingQueue();
}
if(alreadyUnlocked){
  init();
}

document.getElementById('export-backup').addEventListener('click', ()=>{
  const backup = {
    exportedAt: new Date().toISOString(),
    sessions: sessions,
    dayConfig: dayConfig,
    dayData: dayData
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `ahnji-training-backup-${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('backup downloaded');
});

// Sync badge now has exactly three possible states, identical on every
// device/browser: SYNCED (Sheet backend confirmed), LOCAL (this device's
// cache, either because there's no backend configured or the backend was
// unreachable — queued writes retry silently in the background), and NOT
// SAVING (no storage available at all, e.g. localStorage blocked). No
// "pending sync (n)" indicator is shown anymore; retries just happen
// quietly and the badge flips to SYNCED once they land.
function updateSyncBadge(){
  const badge = document.getElementById('sync-badge');
  if(storageMode === 'sheet'){
    badge.textContent = 'SYNCED';
    badge.className = 'sync-badge sheet';
  } else if(storageMode === 'local'){
    badge.textContent = CONFIG.API_URL ? 'OFFLINE · LOCAL' : 'LOCAL ONLY';
    badge.className = 'sync-badge local';
  } else if(storageMode === 'memory'){
    badge.textContent = 'NOT SAVING';
    badge.className = 'sync-badge memory';
  } else {
    badge.textContent = '···';
    badge.className = 'sync-badge';
  }
}

// Retry any queued offline writes: right away on load, whenever the browser
// regains a connection, and every 30s as a safety net. This runs the same
// way regardless of device — there's no platform-specific branching here.
window.addEventListener('online', flushPendingQueue);
setInterval(flushPendingQueue, 30000);

document.getElementById('sync-badge').addEventListener('click', async ()=>{
  if(storageMode === 'sheet' && queueSize() === 0) return;
  showToast('retrying sync…');
  await flushPendingQueue();
  updateSyncBadge();
  if(queueSize() > 0){
    showToast('still offline — will retry automatically');
  }
});
</script>
